<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{DECK_TITLE}}</title>
  <style>
    :root {
      --bg: #F2F2F2;
      --primary: #B8D8BE;
      --accent: #E91E63;
      --text: #2D2926;
      --grid: rgba(45,41,38,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: #1a1a1a; color: var(--text); overflow: hidden;
    }
    .deck { width: 100vw; height: 100vh; position: relative; }
    .slide {
      display: none; width: 100%; height: 100%; padding: 48px 64px;
      background: var(--bg);
      background-image: linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 24px 24px;
      flex-direction: column; justify-content: flex-start;
    }
    .slide.active { display: flex; }
    .slide h1 { font-size: 2.4rem; font-weight: 800; border-bottom: 4px solid var(--primary); padding-bottom: 0.4rem; margin-bottom: 1.5rem; }
    .slide h2 { font-size: 1.1rem; color: #666; margin-bottom: 1rem; font-weight: 500; }
    .slide ul { list-style: none; font-size: 1.35rem; line-height: 1.75; max-width: 900px; }
    .slide li { padding: 0.35rem 0; padding-left: 1.2rem; position: relative; }
    .slide li::before { content: "▸"; position: absolute; left: 0; color: var(--accent); font-weight: bold; }
    .slide img { max-width: 85%; max-height: 45vh; margin: 0.5rem 0 1rem; border: 1px solid #ccc; }
    .caption { font-size: 0.95rem; color: #555; margin-bottom: 1rem; font-style: italic; max-width: 85%; }
    .footer { margin-top: auto; font-size: 0.85rem; color: #888; }
    .pager { position: fixed; bottom: 16px; right: 24px; font-size: 0.9rem; color: #aaa; }
    @media print {
      .slide { display: flex !important; page-break-after: always; height: auto; min-height: 100vh; }
      .pager { display: none; }
    }
  </style>
</head>
<body>
  <div class="deck" id="deck">
    {{SLIDES_HTML}}
  </div>
  <div class="pager" id="pager">1 / 1</div>
  <script>
    (function () {
      const slides = Array.from(document.querySelectorAll('.slide'));
      let idx = 0;
      function show(i) {
        idx = Math.max(0, Math.min(slides.length - 1, i));
        slides.forEach((s, j) => s.classList.toggle('active', j === idx));
        document.getElementById('pager').textContent = (idx + 1) + ' / ' + slides.length;
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); show(idx + 1); }
        if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); show(idx - 1); }
        if (e.key === 'Home') show(0);
        if (e.key === 'End') show(slides.length - 1);
      });
      show(0);
    })();
  </script>
</body>
</html>
